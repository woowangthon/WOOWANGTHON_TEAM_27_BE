name: Merge normalized UTIC snapshot
on:
  workflow_dispatch:
# No schedule until contract, download storage, fixed egress and limits are approved.
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  merge:
    if: vars.UTIC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - run: dart pub get
      - name: Read latest durable ledger
        run: |
          git fetch --no-tags --depth=1 origin data
          git worktree add /tmp/traffic-data FETCH_HEAD
          mkdir -p out
          cp /tmp/traffic-data/traffic-state.json out/traffic-state.json
      - name: Require private normalized snapshot delivery
        run: |
          # Deployment must deliver this file using its approved read-only storage
          # credential. Fail closed until that installation-specific step is added.
          test -f /tmp/utic-normalized.json
          dart run bin/merge_utic_snapshot.dart --snapshot=/tmp/utic-normalized.json --dir=out
      - name: Publish v2 only
        run: |
          git -C /tmp/traffic-data fetch --no-tags --depth=1 origin data
          git -C /tmp/traffic-data checkout --detach FETCH_HEAD
          dart run bin/publish_traffic.dart --dir=out --base=/tmp/traffic-data
          cp out/traffic-state.json out/traffic-v2.json /tmp/traffic-data/
          cd /tmp/traffic-data
          git config user.name liferadar-bot
          git config user.email liferadar-bot@users.noreply.github.com
          git add traffic-state.json traffic-v2.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: merge normalized UTIC snapshot'
          git push origin HEAD:data
