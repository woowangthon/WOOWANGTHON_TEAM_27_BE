name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r news_traffic/requirements.txt
      - run: python -m unittest discover -s news_traffic/tests -v
